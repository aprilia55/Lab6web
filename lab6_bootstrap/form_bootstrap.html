<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Praktikum 6 - Refactor Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">Form Praktikum 6</a>
    </div>
  </nav>

  <!-- Container Form -->
  <div class="container mt-5">
    <h2 class="text-center mb-4">Formulir Data Mahasiswa</h2>

    <form>
      <!-- Nama -->
      <div class="mb-3">
        <label for="nama" class="form-label">Nama Lengkap</label>
        <input type="text" class="form-control" id="nama" placeholder="Masukkan nama lengkap">
      </div>

      <!-- NIM -->
      <div class="mb-3">
        <label for="nim" class="form-label">NIM</label>
        <input type="text" class="form-control" id="nim" placeholder="312410455">
      </div>

      <!-- Email -->
      <div class="mb-3">
        <label for="email" class="form-label">Alamat Email</label>
        <input type="email" class="form-control" id="email" placeholder="nama@contoh.com">
      </div>

      <!-- Jurusan -->
      <div class="mb-3">
        <label for="jurusan" class="form-label">Jurusan</label>
        <select class="form-select" id="jurusan">
          <option selected>Pilih jurusan</option>
          <option value="TI">Teknik Informatika</option>
          <option value="SI">Sistem Informasi</option>
          <option value="MI">Manajemen Informatika</option>
        </select>
      </div>

      <!-- Pesan -->
      <div class="mb-3">
        <label for="pesan" class="form-label">Pesan</label>
        <textarea class="form-control" id="pesan" rows="3" placeholder="Tuliskan pesan atau catatan..."></textarea>
      </div>

      <!-- Tombol -->
      <button type="submit" class="btn btn-primary">Kirim</button>
      <button type="reset" class="btn btn-secondary">Bersihkan</button>
    </form>
  </div>

  <!-- Footer -->
  <footer class="bg-dark text-white text-center py-3 mt-5">
    <p>&copy; 2025 Praktikum 6 - Bootstrap Form</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
